name: Build SchoolQR APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: android-direct
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        working-directory: android-direct
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -30
          unzip -t "$APK"

      - name: Rename APK
        working-directory: android-direct
        run: cp app/build/outputs/apk/debug/app-debug.apk SchoolQR-Max.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SchoolQR-Max-APK
          path: android-direct/SchoolQR-Max.apk
          if-no-files-found: error
